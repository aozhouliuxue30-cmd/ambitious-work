name: Publish bilingual 1.1.0
on:
  workflow_dispatch:
permissions: {}
jobs:
  publish:
    if: github.repository == 'aozhouliuxue30-cmd/ambitious-work' && github.actor == 'aozhouliuxue30-cmd'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish bilingual source and verified downloads
        shell: bash
        run: |
          python3 - <<'PY_RELEASE'
          import base64
          import gzip
          import hashlib
          import io
          import json
          import os
          import pathlib
          import subprocess
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile
          
          REPO = 'aozhouliuxue30-cmd/ambitious-work'
          VERSION = '1.1.0'
          PAYLOAD = ''
          PAYLOAD_SHA256 = '92375ddea3dfc2c70fca8ee0f1ac454e445dc8aa90239ceb2a85f2aee3aa9ecb'
          
          
          def bundle(entries):
              out = io.BytesIO()
              with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as z:
                  for name, content in sorted(entries.items()):
                      info = zipfile.ZipInfo(name, date_time=(2026, 10, 21, 0, 0, 0))
                      info.external_attr = 0o100644 << 16
                      info.compress_type = zipfile.ZIP_DEFLATED
                      z.writestr(info, content)
              return out.getvalue()
          
          
          def run():
              assert os.environ['GITHUB_REPOSITORY'] == REPO
              assert os.environ['GITHUB_ACTOR'] == 'aozhouliuxue30-cmd'
              encoded = gzip.decompress(base64.b64decode(PAYLOAD))
              assert hashlib.sha256(encoded).hexdigest() == PAYLOAD_SHA256
              files = json.loads(encoded)
              for name in files:
                  path = pathlib.PurePosixPath(name)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert path.parts[0] not in {'.git', '.github'}
                  assert not name.lower().endswith('.pdf')
              assert json.loads(files['plugin.json'])['version'] == VERSION
              token = os.environ['GH_TOKEN']
              api_base = 'https://api.github.com/repos/' + REPO
          
              def api(method, path, value=None, raw=None, kind='application/json', optional=False):
                  url = path if path.startswith('https://') else api_base + path
                  parsed = urllib.parse.urlparse(url)
                  assert parsed.scheme == 'https' and parsed.hostname in {'api.github.com', 'uploads.github.com'}
                  assert parsed.path.startswith('/repos/' + REPO + '/')
                  data = raw if raw is not None else (json.dumps(value).encode() if value is not None else None)
                  request = urllib.request.Request(url, data=data, method=method, headers={
                      'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': kind,
                  })
                  try:
                      with urllib.request.urlopen(request, timeout=60) as response:
                          return json.load(response)
                  except urllib.error.HTTPError as exc:
                      if optional and exc.code == 404:
                          return None
                      raise RuntimeError('GitHub API rejected ' + method + ': HTTP ' + str(exc.code)) from None
          
              release = api('GET', '/releases/tags/v' + VERSION, optional=True)
              if release:
                  assert release['draft'] and not release.get('immutable'), 'Version already published; stop'
              clone = subprocess.run(['git', 'clone', '--quiet', 'https://github.com/' + REPO + '.git', 'repo'], capture_output=True)
              assert clone.returncode == 0, 'Repository clone failed'
              folder = pathlib.Path('repo')
          
              def git(*args):
                  process = subprocess.run(['git', '-C', str(folder), *args], capture_output=True)
                  assert process.returncode == 0, 'Local Git operation failed'
                  return process.stdout
          
              original = git('rev-parse', 'HEAD').decode().strip()
              assert original == os.environ['GITHUB_SHA'], 'Branch changed after dispatch'
              for name, content in files.items():
                  path = folder / name
                  assert not path.is_symlink(), 'Unexpected symlink'
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(content, encoding='utf-8', newline='')
              git('add', '--', *sorted(files))
              changed = subprocess.run(['git', '-C', str(folder), 'diff', '--cached', '--quiet']).returncode
              assert changed in {0, 1}
              if changed:
                  git('-c', 'user.name=aozhouliuxue30-cmd', '-c',
                      'user.email=227332951+aozhouliuxue30-cmd@users.noreply.github.com',
                      'commit', '--quiet', '-m', 'Release 1.1.0: bilingual interface and output language controls')
              head = git('rev-parse', 'HEAD').decode().strip()
              auth = base64.b64encode(('x-access-token:' + token).encode()).decode()
              pushed = subprocess.run(['git', '-C', str(folder), '-c',
                  'http.https://github.com/.extraheader=AUTHORIZATION: basic ' + auth,
                  'push', '--quiet', 'origin', 'HEAD:refs/heads/main'], capture_output=True)
              if pushed.returncode:
                  raise RuntimeError('Source push rejected; no force push attempted')
              assert api('GET', '/git/ref/heads/main')['object']['sha'] == head
              existing_tag = api('GET', '/git/ref/tags/v' + VERSION, optional=True)
              if existing_tag:
                  target = existing_tag['object']
                  while target['type'] == 'tag':
                      target = api('GET', '/git/tags/' + target['sha'])['object']
                  assert target['type'] == 'commit' and target['sha'] == head, 'Existing version tag differs; stop'
              encoded_files = {name: content.encode('utf-8') for name, content in files.items()}
              assets = {
                  'ambitious-work-v1.1.0.zip': bundle(encoded_files),
                  'ambitious-work-skill-v1.1.0.zip': bundle({
                      'ambitious-work/' + name[len('skills/ambitious-work/'):]: content
                      for name, content in encoded_files.items() if name.startswith('skills/ambitious-work/')
                  }),
                  'start-here-zh-v1.1.0.txt': encoded_files['examples/quick-prompt.txt'],
                  'start-here-en-v1.1.0.txt': encoded_files['examples/quick-prompt.en.txt'],
                  'ambitious-work-bilingual-v1.1.0.html': encoded_files['docs/index.html'],
              }
              assets['SHA256SUMS.txt'] = ''.join(hashlib.sha256(c).hexdigest() + '  ' + n + '\n'
                  for n, c in sorted(assets.items())).encode()
              if not release:
                  release = api('POST', '/releases', {
                      'tag_name': 'v' + VERSION, 'target_commitish': head,
                      'name': 'Ambitious Work v1.1.0 · 中英双语 / Bilingual',
                      'body': '## 中英双语版 / Bilingual edition\n\n- 下载 HTML，双击即可打开：界面可切换中文 / English，输出可选中文 / English / 中英双语。\n- HTML works offline: switch the interface between Chinese and English; choose Chinese, English, or paired bilingual output independently.\n- 支持示例、复制与 TXT 下载；不调用模型，不上传表单输入，无需密钥。\n- Examples, copy, and TXT export included. No model calls, form uploads, or API keys.\n- 提供中文 / English README、快速开始、提示词和示例；独立 Skill 保留相同语言选项。\n- Includes bilingual documentation, examples, starter prompts, and a standalone Skill.\n\n交互功能已通过浏览器检查；18 个模型行为用例仍未运行。UI functionality was browser-checked; the 18 model behavior cases remain unexecuted.\n\nMIT License. Independent implementation; original source attribution is preserved.',
                      'draft': True, 'prerelease': False,
                  })
              else:
                  release = api('PATCH', '/releases/' + str(release['id']), {'target_commitish': head})
              uploaded = {a['name']: a for a in api('GET', '/releases/' + str(release['id']))['assets']}
              endpoint = release['upload_url'].split('{', 1)[0]
              for name, content in assets.items():
                  if name in uploaded:
                      assert uploaded[name]['digest'] == 'sha256:' + hashlib.sha256(content).hexdigest()
                      continue
                  kind = 'application/zip' if name.endswith('.zip') else ('text/html; charset=utf-8' if name.endswith('.html') else 'text/plain; charset=utf-8')
                  api('POST', endpoint + '?name=' + urllib.parse.quote(name), raw=content, kind=kind)
              complete = api('GET', '/releases/' + str(release['id']))['assets']
              assert {a['name'] for a in complete if a['state'] == 'uploaded'} == set(assets)
              release = api('PATCH', '/releases/' + str(release['id']), {'draft': False, 'make_latest': 'true'})
              final_tag = api('GET', '/git/ref/tags/v' + VERSION)['object']
              while final_tag['type'] == 'tag':
                  final_tag = api('GET', '/git/tags/' + final_tag['sha'])['object']
              assert final_tag['type'] == 'commit' and final_tag['sha'] == head, 'Published tag mismatch'
              print(json.dumps({'version': VERSION, 'source_files': len(files), 'head': head,
                                'release': release['html_url'], 'assets': list(assets)}))
              if os.environ.get('GITHUB_STEP_SUMMARY'):
                  pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('Bilingual release published.\n\n' + release['html_url'])
          
          
          if __name__ == '__main__':
              run()
          PY_RELEASE
