name: One-time privacy cleanup and release
on:
  workflow_dispatch:
permissions: {}
jobs:
  maintenance:
    if: github.repository == 'aozhouliuxue30-cmd/ambitious-work' && github.actor == 'aozhouliuxue30-cmd'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Clean commit identities and publish user downloads
        shell: bash
        run: |
          python3 - <<'PY_MAINTENANCE'
          import base64
          import hashlib
          import io
          import json
          import os
          import pathlib
          import re
          import subprocess
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile
          
          REPO = 'aozhouliuxue30-cmd/ambitious-work'
          NOREPLY = b'227332951+aozhouliuxue30-cmd@users.noreply.github.com'
          
          
          def git(repo, *args, data=None):
              process = subprocess.run(['git', '-C', str(repo), *args], input=data,
                                       stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              if process.returncode:
                  raise RuntimeError('Git operation failed: ' + process.stderr.decode(errors='replace')[:1500])
              return process.stdout
          
          
          def clean_history(repo):
              refs = {}
              for line in git(repo, 'for-each-ref', '--format=%(refname) %(objectname)').decode().splitlines():
                  ref, sha = line.split()
                  if ref.startswith('refs/heads/') or ref.startswith('refs/tags/'):
                      refs[ref] = sha
              if set(refs) != {'refs/heads/main', 'refs/tags/v1.0.1'}:
                  raise RuntimeError('Repository refs changed; review required')
              if any(git(repo, 'cat-file', '-t', sha).strip() != b'commit' for sha in refs.values()):
                  raise RuntimeError('Unexpected annotated tag; review required')
              mapping = {}
              changed_identities = 0
              old_commits = git(repo, 'rev-list', '--topo-order', '--reverse', *refs.values()).decode().splitlines()
              for old in old_commits:
                  raw = git(repo, 'cat-file', 'commit', old)
                  headers, separator, message = raw.partition(b'\n\n')
                  if not separator:
                      raise RuntimeError('Invalid commit')
                  records = []
                  for line in headers.split(b'\n'):
                      if line.startswith(b' '):
                          records[-1] += b'\n' + line
                      else:
                          records.append(line)
                  output = []
                  for record in records:
                      key, _, value = record.partition(b' ')
                      if key == b'gpgsig':
                          continue
                      if key not in {b'tree', b'parent', b'author', b'committer', b'encoding'}:
                          raise RuntimeError('Unexpected commit header; review required')
                      if key == b'parent':
                          record = b'parent ' + mapping[value.decode()].encode()
                      elif key in {b'author', b'committer'}:
                          email = re.search(br'<([^<>]+)>', value)
                          if email is None:
                              raise RuntimeError('Invalid identity')
                          address = email.group(1)
                          if not (address.endswith(b'@users.noreply.github.com') or address == b'noreply@github.com'):
                              record = re.sub(br'<[^<>]+>', b'<' + NOREPLY + b'>', record)
                              changed_identities += 1
                      output.append(record)
                  rewritten = b'\n'.join(output) + b'\n\n' + message
                  new = git(repo, 'hash-object', '-t', 'commit', '-w', '--stdin', data=rewritten).decode().strip()
                  mapping[old] = new
                  assert git(repo, 'rev-parse', old + '^{tree}') == git(repo, 'rev-parse', new + '^{tree}')
              for new in mapping.values():
                  metadata = git(repo, 'show', '-s', '--format=%ae%n%ce', new).decode().splitlines()
                  assert all(e.endswith('@users.noreply.github.com') or e == 'noreply@github.com' for e in metadata)
              return refs, {ref: mapping[sha] for ref, sha in refs.items()}, len(old_commits), changed_identities
          
          
          def archive(entries):
              buffer = io.BytesIO()
              with zipfile.ZipFile(buffer, 'w', zipfile.ZIP_DEFLATED) as bundle:
                  for name, content in sorted(entries.items()):
                      info = zipfile.ZipInfo(name, date_time=(2026, 10, 21, 0, 0, 0))
                      info.external_attr = 0o100644 << 16
                      info.compress_type = zipfile.ZIP_DEFLATED
                      bundle.writestr(info, content)
              return buffer.getvalue()
          
          
          def package_files(repo, commit):
              names = git(repo, 'ls-tree', '-r', '--name-only', commit).decode().splitlines()
              files = {n: git(repo, 'show', commit + ':' + n) for n in names if not n.startswith('.github/')}
              assert json.loads(files['plugin.json'])['version'] == '1.0.2'
              assert all(not name.lower().endswith('.pdf') for name in files)
              assets = {
                  'ambitious-work-v1.0.2.zip': archive(files),
                  'ambitious-work-skill-v1.0.2.zip': archive({
                      'ambitious-work/' + n[len('skills/ambitious-work/'):]: c
                      for n, c in files.items() if n.startswith('skills/ambitious-work/')
                  }),
                  'start-here-v1.0.2.txt': files['examples/quick-prompt.txt'],
              }
              assets['SHA256SUMS.txt'] = ''.join(
                  hashlib.sha256(content).hexdigest() + '  ' + name + '\n'
                  for name, content in sorted(assets.items())
              ).encode()
              return assets
          
          
          def run():
              assert os.environ['GITHUB_REPOSITORY'] == REPO
              assert os.environ['GITHUB_ACTOR'] == 'aozhouliuxue30-cmd'
              token = os.environ['GH_TOKEN']
              api_base = 'https://api.github.com/repos/' + REPO
          
              def api(method, path, value=None, raw=None, content_type='application/json'):
                  url = path if path.startswith('https://') else api_base + path
                  parsed = urllib.parse.urlparse(url)
                  assert parsed.scheme == 'https' and parsed.hostname in {'api.github.com', 'uploads.github.com'}
                  assert parsed.path.startswith('/repos/' + REPO + '/')
                  body = raw if raw is not None else (json.dumps(value).encode() if value is not None else None)
                  request = urllib.request.Request(url, data=body, method=method, headers={
                      'Authorization': 'Bearer ' + token,
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': content_type,
                  })
                  try:
                      with urllib.request.urlopen(request, timeout=60) as response:
                          return json.load(response)
                  except urllib.error.HTTPError as exc:
                      raise RuntimeError('GitHub API request failed: ' + method + ' HTTP ' + str(exc.code)) from None
          
              old_release = api('GET', '/releases/tags/v1.0.1')
              assert not old_release.get('immutable'), 'Release is immutable; review required'
              repo_path = pathlib.Path('repo.git')
              subprocess.run(['git', 'clone', '--bare', 'https://github.com/' + REPO + '.git', str(repo_path)], check=True)
              old_refs, new_refs, count, identities = clean_history(repo_path)
              assert old_refs['refs/heads/main'] == os.environ['GITHUB_SHA'], 'Branch changed after dispatch'
              assets = package_files(repo_path, new_refs['refs/heads/main'])
              for ref, expected in old_refs.items():
                  assert api('GET', '/git/ref/' + ref[len('refs/'):])['object']['sha'] == expected
              auth = base64.b64encode(('x-access-token:' + token).encode()).decode()
              push_args = ['git', '-C', str(repo_path), '-c',
                           'http.https://github.com/.extraheader=AUTHORIZATION: basic ' + auth,
                           'push', '--atomic']
              push_args.extend('--force-with-lease=' + ref + ':' + old for ref, old in old_refs.items())
              push_args.append('origin')
              push_args.extend(new + ':' + ref for ref, new in new_refs.items())
              pushed = subprocess.run(push_args, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              if pushed.returncode:
                  reason = pushed.stderr.decode(errors='replace').replace(token, '[redacted]').replace(auth, '[redacted]')
                  raise RuntimeError('History update rejected: ' + reason[:1800])
              for ref, expected in new_refs.items():
                  assert api('GET', '/git/ref/' + ref[len('refs/'):])['object']['sha'] == expected
              api('PATCH', '/releases/' + str(old_release['id']), {
                  'name': 'AI 实干工作流 v1.0.1（源码版）',
                  'body': '独立 AI 工作流源码，MIT License。建议使用 v1.0.2 的上手提示词、独立 Skill 包和完整插件包。公开分支和标签中的提交邮箱已改为 GitHub noreply 地址；外部副本与旧缓存可能仍保留旧记录。',
              })
              release = api('POST', '/releases', {
                  'tag_name': 'v1.0.2', 'target_commitish': new_refs['refs/heads/main'],
                  'name': 'AI 实干工作流 · Ambitious Work v1.0.2',
                  'body': '把目标、资料和约束交给 AI，推进到可检查的实际成果。\n\n下载使用：\n- start-here-v1.0.2.txt：复制到 ChatGPT 等助手即可开始，无需安装。\n- ambitious-work-skill-v1.0.2.zip：供支持 Agent Skills 的工具导入。\n- ambitious-work-v1.0.2.zip：完整插件源码和示例。\n- SHA256SUMS.txt：下载文件校验值。\n\n使用步骤与示例见仓库 README 和 QUICKSTART.md。无 API 密钥、外部服务器或自动安装动作。MIT License，保留原文归因；15 个模型行为用例尚未运行。',
                  'draft': True, 'prerelease': False,
              })
              upload_base = release['upload_url'].split('{', 1)[0]
              for name, content in assets.items():
                  kind = 'application/zip' if name.endswith('.zip') else 'text/plain; charset=utf-8'
                  api('POST', upload_base + '?name=' + urllib.parse.quote(name), raw=content, content_type=kind)
              uploaded = api('GET', '/releases/' + str(release['id']))['assets']
              assert {a['name'] for a in uploaded if a['state'] == 'uploaded'} == set(assets)
              release = api('PATCH', '/releases/' + str(release['id']), {'draft': False, 'make_latest': 'true'})
              print(json.dumps({'commits_checked': count, 'identities_sanitized': identities,
                                'main': new_refs['refs/heads/main'], 'tag_v1_0_1': new_refs['refs/tags/v1.0.1'],
                                'release': release['html_url'], 'assets': list(assets)}, ensure_ascii=False))
              summary = os.environ.get('GITHUB_STEP_SUMMARY')
              if summary:
                  pathlib.Path(summary).write_text('Privacy cleanup completed.\n\n' + str(count) +
                      ' commits checked; ' + str(identities) + ' identities sanitized.\n\n' + release['html_url'] + '\n')
          
          
          if __name__ == '__main__':
              run()
          PY_MAINTENANCE
